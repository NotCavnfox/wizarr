name: fork-sync-upstream

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Published stable vX.Y.Z tag (default latest stable)
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  sync:
    # Pin the reviewed, merged shared revision.
    uses: NotCavnfox/.github/.github/workflows/sync-upstream.yml@fe15ddf831801f4c8215141217fec0afb9d22533
    with:
      upstream_repo: wizarrrr/wizarr
      base_branch: main
      upstream_ref: ${{ inputs.upstream_ref }}
