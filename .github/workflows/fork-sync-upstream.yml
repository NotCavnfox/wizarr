name: fork-sync-upstream

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Published stable vX.Y.Z tag (default latest stable)
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  sync:
    # Replace the marker only with the reviewed, merged shared commit SHA.
    uses: NotCavnfox/.github/.github/workflows/sync-upstream.yml@8554d67712f5e6565831431a876c6f08e04cdb13
    with:
      upstream_repo: wizarrrr/wizarr
      base_branch: main
      upstream_ref: ${{ inputs.upstream_ref }}
